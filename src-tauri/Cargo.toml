[package]
name = "library-of-babel-ru"
version = "0.1.0"
description = "Вавилонская Библиотека — современная standalone-реализация на Rust + Tauri"
authors = ["LegitPlayer"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "library_of_babel_ru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# production-сборка: встраивает dist/ в бинарник вместо обращения к dev-серверу
custom-protocol = ["tauri/custom-protocol"]
default = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
rand = "0.8"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "bmp",
  "gif",
  "webp",
] }
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
